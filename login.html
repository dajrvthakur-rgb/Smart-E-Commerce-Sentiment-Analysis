<!DOCTYPE html>
<html>
<head>
    <title>Login | MyStore Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 350px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="card p-4 shadow">
    <h4 class="text-center mb-3">🛒 MyStore Login</h4>

    <input type="text" id="username" class="form-control mb-2" placeholder="Username">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>
    <button class="btn btn-success w-100" onclick="register()">Register</button>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

/* 🔵 REGISTER */
function register(){
    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();

    if(user === "" || pass === ""){
        alert("Please fill all fields");
        return;
    }

    let exists = users.find(u => u.user === user);

    if(exists){
        alert("User already exists!");
        return;
    }

    users.push({user, pass});
    localStorage.setItem("users", JSON.stringify(users));

    alert("Registered successfully! Now login.");
}

/* 🟢 LOGIN */
function login(){
    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();

    if(user === "" || pass === ""){
        alert("Please fill all fields");
        return;
    }

    let found = users.find(u => u.user === user && u.pass === pass);

    if(found){
        localStorage.setItem("loggedInUser", user);
        alert("Login successful!");
        window.location.href = "/store";
    } else {
        alert("Invalid username or password");
    }
}
</script>

</body>
</html>
