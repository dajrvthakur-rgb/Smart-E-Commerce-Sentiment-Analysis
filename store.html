<!DOCTYPE html>
<html>
<head>
    <title>MyStore Pro (Ultimate Version)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f8f9fa; transition:0.3s; }

        .dark-mode {
            background:#121212 !important;
            color:white;
        }

        .card {
            border-radius:15px;
            overflow:hidden;
            transition:0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
        }

        img {
            height:200px;
            object-fit:contain;
            cursor:pointer;
        }
    </style>
</head>

<body>

<script>
// 🔐 LOGIN PROTECTION
let currentUser = localStorage.getItem("loggedInUser");

if(!currentUser){
    window.location.href = "/";
}
</script>

<!-- Toast -->
<div class="toast position-fixed bottom-0 end-0 p-3" id="toast">
    <div class="toast-body bg-success text-white">
        Added to cart!
    </div>
</div>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <h4 class="text-white">🛒 MyStore Pro</h4>

    <div>
        <span class="text-white me-3">👤 <b id="userName"></b></span>

        <button class="btn btn-warning me-2" onclick="toggleDark()">🌙</button>

        <button class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
            Cart (<span id="cartCount">0</span>)
        </button>

        <button class="btn btn-danger ms-2" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4">

    <div class="row mb-4">
        <div class="col-md-4">
            <input type="text" id="search" class="form-control" placeholder="Search or type intent...">
        </div>

        <div class="col-md-4">
            <select id="category" class="form-select">
                <option value="all">All</option>
            </select>
        </div>

        <div class="col-md-4">
            <select id="sort" class="form-select">
                <option value="">Sort</option>
                <option value="low">Low → High</option>
                <option value="high">High → Low</option>
            </select>
        </div>
    </div>

    <p id="productCount" class="text-muted"></p>

    <div class="row" id="products"></div>\n\n
    <div class="card p-4 mb-4">
        <h5>📝 Product Review Sentiment</h5>
        <p class="text-muted mb-3">Submit a review to see its sentiment analysis.</p>
        <div class="row g-2">
            <div class="col-md-4">
                <input id="reviewProduct" class="form-control" placeholder="Product name">
            </div>
            <div class="col-md-6">
                <textarea id="reviewText" class="form-control" rows="2" placeholder="Write your review"></textarea>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="submitReview()">Analyze Review</button>
            </div>
        </div>
        <div id="reviewResult" class="mt-3"></div>
        <div class="mt-3">
            <button class="btn btn-outline-secondary btn-sm" onclick="loadAnalytics()">Show Recent Reviews</button>
            <div id="reviewAnalytics" class="mt-3"></div>
        </div>
    </div>

</div>

<!-- Cart -->
<div class="offcanvas offcanvas-end" id="cartCanvas">
    <div class="offcanvas-header">
        <h5>🛍️ Cart</h5>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
        <div id="cartItems"></div>
        <hr>
        <h5>Total: ₹<span id="total">0</span></h5>
        <button class="btn btn-danger w-100 mt-3" onclick="clearCart()">Clear Cart</button>
    </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 id="modalTitle"></h5>
            <img id="modalImg" class="w-100">
            <p id="modalPrice"></p>
        </div>
    </div>
</div>

<script>
let products = [];

// 👤 USER-SPECIFIC CART
let cartKey = "cart_" + currentUser;
let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

let isLoaded = false;
const INR = 83;

// Show username
document.getElementById("userName").innerText = currentUser;

// Dark Mode Load
if(localStorage.getItem("darkMode") === "true"){
    document.body.classList.add("dark-mode");
}

// Intent Detection
function detectIntent(query){
    query = query.toLowerCase();

    if(query.match(/cheap|low|budget/)) return "low";
    if(query.match(/expensive|premium|costly/)) return "high";
    if(query.match(/electronics|phone|laptop|tv/)) return "electronics";
    if(query.match(/clothes|shirt|jeans/)) return "clothing";

    return "normal";
}

// Load Products
async function loadProducts(){
    document.getElementById("products").innerHTML =
        `<div class="text-center"><div class="spinner-border"></div></div>`;

    try {
        let res = await fetch('https://dummyjson.com/products');
        let data = await res.json();

        products = data.products.map(p => ({
            id: p.id,
            title: p.title,
            price: p.price,
            category: p.category,
            image: p.thumbnail
        }));

    } catch {
        products = [];
        for(let i=1;i<=20;i++){
            products.push({
                id:i,
                title:"Product "+i,
                price:Math.floor(Math.random()*500)+50,
                category:i%2===0?"electronics":"clothing",
                image:"https://via.placeholder.com/200"
            });
        }
    }

    isLoaded = true;
    populateCategories();
    displayProducts(products);
}

// Categories
function populateCategories(){
    let categories = [...new Set(products.map(p=>p.category))];
    let select = document.getElementById("category");

    select.innerHTML = `<option value="all">All</option>`;
    categories.forEach(cat=>{
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
}

// Display
function displayProducts(list){
    let output="";

    document.getElementById("productCount").innerText =
        list.length + " products found";

    list.forEach(p=>{
        let inCart = cart.find(i => i.id === p.id);

        output+=`
        <div class="col-md-4 mb-4">
            <div class="card p-2">
                <img src="${p.image}" data-id="${p.id}" class="product-img">
                <div class="card-body text-center">
                    <h6>${p.title}</h6>
                    <p class="text-success fw-bold">
                        ₹${Math.round(p.price * INR).toLocaleString('en-IN')}
                    </p>

                    <button class="btn ${inCart ? 'btn-success' : 'btn-dark'} w-100 add-btn" data-id="${p.id}">
                        ${inCart ? 'Go to Cart' : 'Add to Cart'}
                    </button>
                </div>
            </div>
        </div>`;
    });

    document.getElementById("products").innerHTML =
        output || "No products found";
}

// Filter
function filterProducts(){
    if(!isLoaded) return;

    let search = document.getElementById("search").value.toLowerCase().trim();
    let category = document.getElementById("category").value;
    let sort = document.getElementById("sort").value;

    let intent = detectIntent(search);

    let filtered = products.filter(p => {
        let matchTitle = p.title.toLowerCase().includes(search);
        let matchCategory = (category === "all" || p.category === category);

        if(intent !== "normal") matchTitle = true;

        return matchTitle && matchCategory;
    });

    if(intent === "electronics"){
        filtered = filtered.filter(p => p.category.includes("electronics"));
    }

    if(intent === "clothing"){
        filtered = filtered.filter(p => p.category.includes("clothing"));
    }

    if(sort === "low" || intent === "low"){
        filtered.sort((a,b)=>a.price-b.price);
    }

    if(sort === "high" || intent === "high"){
        filtered.sort((a,b)=>b.price-a.price);
    }

    displayProducts(filtered);
}

// Cart
function addToCart(id){
    let product = products.find(p=>p.id===id);
    let item = cart.find(p=>p.id===id);

    if(item) item.qty++;
    else cart.push({...product, qty:1});

    updateCart();
    filterProducts();

    let toast = new bootstrap.Toast(document.getElementById('toast'));
    toast.show();
}

function removeItem(id){
    cart = cart.filter(i=>i.id !== id);
    updateCart();
    filterProducts();
}

function changeQty(id, val){
    let item = cart.find(i=>i.id===id);
    if(item){
        item.qty += val;
        if(item.qty <= 0) cart = cart.filter(i=>i.id !== id);
    }
    updateCart();
    filterProducts();
}

function clearCart(){
    cart = [];
    updateCart();
    filterProducts();
}

function updateCart(){
    let total=0, output="", count=0;

    cart.forEach(i=>{
        total += Math.round(i.price * INR) * i.qty;
        count += i.qty;

        output+=`
        <div class="d-flex justify-content-between mb-2">
            <span>${i.title.substring(0,15)}</span>
            <span>
                <button onclick="changeQty(${i.id},-1)">-</button>
                ${i.qty}
                <button onclick="changeQty(${i.id},1)">+</button>
                <button onclick="removeItem(${i.id})">❌</button>
            </span>
        </div>`;
    });

    document.getElementById("cartItems").innerHTML =
        output || "<p class='text-muted'>Cart is empty</p>";

    document.getElementById("total").innerText =
        total.toLocaleString('en-IN');

    document.getElementById("cartCount").innerText = count;

    // 🔥 SAVE USER-SPECIFIC CART
    localStorage.setItem(cartKey, JSON.stringify(cart));
}

// Dark Mode Toggle
function toggleDark(){
    document.body.classList.toggle("dark-mode");
    localStorage.setItem("darkMode",
        document.body.classList.contains("dark-mode"));
}

// 🔓 LOGOUT
function logout(){
    localStorage.removeItem("loggedInUser");
    window.location.href = "/";
}

// Events
document.getElementById("products").addEventListener("click", function(e){

    if(e.target.classList.contains("add-btn")){
        let id = parseInt(e.target.dataset.id);
        let alreadyInCart = cart.find(p => p.id === id);

        if(alreadyInCart){
            new bootstrap.Offcanvas(document.getElementById('cartCanvas')).show();
        } else {
            addToCart(id);
        }
    }

    if(e.target.classList.contains("product-img")){
        let product = products.find(p=>p.id == e.target.dataset.id);

        document.getElementById("modalTitle").innerText = product.title;
        document.getElementById("modalImg").src = product.image;
        document.getElementById("modalPrice").innerText =
            "₹" + Math.round(product.price * INR).toLocaleString('en-IN');

        new bootstrap.Modal(document.getElementById('productModal')).show();
    }
});

document.getElementById("search").addEventListener("input",filterProducts);
document.getElementById("category").addEventListener("change",filterProducts);
document.getElementById("sort").addEventListener("change",filterProducts);

// Review sentiment analysis
async function submitReview(){
    const product = document.getElementById("reviewProduct").value.trim();
    const text = document.getElementById("reviewText").value.trim();
    const result = document.getElementById("reviewResult");

    if(!product || !text){
        result.innerHTML = '<div class="alert alert-warning">Please enter a product name and review.</div>';
        return;
    }

    result.innerHTML = '<div class="text-muted">Analyzing review...</div>';
    try {
        const response = await fetch('/submit-review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({product: product, text: text})
        });
        const data = await response.json();
        if(!response.ok) throw new Error(data.error || 'Could not analyze review.');

        result.innerHTML = `
            <div class="alert alert-${data.color}">
                <strong>Sentiment: ${data.sentiment}</strong><br>
                Polarity: ${data.polarity} | Subjectivity: ${data.subjectivity}
                ${data.flagged ? '<br>This review has been flagged for attention.' : ''}
            </div>`;
        loadAnalytics();
    } catch(error) {
        result.innerHTML = `<div class="alert alert-danger">${error.message} Make sure the Flask server is running.</div>`;
    }
}

// Load recent review analytics
async function loadAnalytics(){
    const container = document.getElementById('reviewAnalytics');
    container.innerHTML = '<p class="text-muted">Loading reviews...</p>';
    try {
        const response = await fetch('/analytics');
        if(!response.ok) throw new Error('Could not load review analytics.');
        const data = await response.json();
        let html = `<p><strong>Total:</strong> ${data.total} &nbsp; <strong>Positive:</strong> ${data.positive} &nbsp; <strong>Negative:</strong> ${data.negative}</p>`;
        if(data.reviews.length){
            html += '<div class="list-group">';
            data.reviews.forEach(review => {
                const safeProduct = escapeHtml(review.product);
                const safeText = escapeHtml(review.text);
                html += `<div class="list-group-item"><strong>${safeProduct}</strong> — <span class="badge bg-${review.sentiment === 'Positive' ? 'success' : review.sentiment === 'Negative' ? 'danger' : 'secondary'}">${review.sentiment}</span><br>${safeText}</div>`;
            });
            html += '</div>';
        } else {
            html += '<p class="text-muted">No reviews yet.</p>';
        }
        container.innerHTML = html;
    } catch(error) {
        container.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
    }
}

function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

// Init
loadProducts();
updateCart();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
